title: Arms Raised in a V
description: An evolving digital-garden experiment by Bodhi 心 Paine
baseurl: "/arms-raised-in-a-v"
url: "https://bodhipaine.github.io"

theme: minima
markdown: kramdown

# Without this, minima's header nav auto-lists every page on the site that
# has a title - including every synced Mastodon note. header_pages overrides
# that, but Liquid's `default` filter treats an *empty* array as "not set"
# and falls back to listing everything anyway - so this points at a path
# that matches no real page, giving header.html's for-loop something to
# iterate that never resolves to a page and therefore never renders a link.
header_pages: ["_no-header-links"]

exclude: ["node_modules/", "public/", "quartz/"]